<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acceso a Residencial Angel Ganivet: Nueva promoción de 33 viviendas en Granada. Barsant Promociones Inmobiliarias.">
    <title>Acceso | Residencial Angel Ganivet | Barsant Promociones Inmobiliarias</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }
        
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #3a3a3a;
            margin-bottom: 10px;
        }

        .logo span {
            color: #e0c88c;
        }
        
        .login-title {
            font-family: 'Playfair Display', serif;
            color: #333;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }
        
        .login-subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        
        .password-container {
            position: relative;
            margin-bottom: 20px;
        }
        
        .login-input {
            width: 100%;
            padding: 15px 50px 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
        }

        .form-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            margin-bottom: 15px;
        }
        
        .login-input:focus,
        .form-input:focus {
            outline: none;
            border-color: #e0c88c;
            box-shadow: 0 0 0 3px rgba(224, 200, 140, 0.1);
        }
        
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            color: #666;
            transition: color 0.3s ease;
        }
        
        .password-toggle:hover {
            color: #e0c88c;
        }
        
        .login-button {
            width: 100%;
            background: linear-gradient(135deg, #e0c88c, #d4bc80);
            color: #3a3a3a;
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
        }
        
        .login-button:hover:not(:disabled) {
            background: linear-gradient(135deg, #d4bc80, #c4ac70);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(224, 200, 140, 0.3);
        }
        
        .login-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            opacity: 0.7;
        }
        
        .message {
            margin: 15px 0;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            animation: slideIn 0.3s ease-out;
        }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }
        
        .success-message {
            background: #e8f5e8;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .hidden {
            display: none !important;
        }

        .user-data-form {
            text-align: left;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .required {
            color: #c62828;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
                margin: 10px;
            }
            
            .logo {
                font-size: 1.5rem;
            }
            
            .login-title {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            Barsant <span>Promociones</span>
        </div>
        
        <!-- Paso 1: Login con contraseña -->
        <div id="password-step">
            <h2 class="login-title">Acceso Privado</h2>
            <p class="login-subtitle">
                Introduzca su contraseña para acceder a<br>
                <strong>Residencial Angel Ganivet</strong>
            </p>
            
            <div class="password-container">
                <input 
                    type="password" 
                    id="password" 
                    class="login-input" 
                    placeholder="Contraseña de acceso" 
                    required
                    autocomplete="current-password"
                >
                <button 
                    type="button" 
                    class="password-toggle" 
                    id="togglePassword"
                    title="Mostrar/Ocultar contraseña"
                >
                    <i class="fas fa-eye" id="eyeIcon"></i>
                </button>
            </div>
            
            <div id="error-message" class="message error-message"></div>
            <div id="success-message" class="message success-message"></div>
            
            <button type="button" id="login-btn" class="login-button">
                <i class="fas fa-sign-in-alt"></i> Acceder
            </button>
        </div>

        <!-- Paso 2: Formulario de datos del usuario -->
        <div id="user-data-step" class="hidden">
            <h2 class="login-title">Datos de Contacto</h2>
            <p class="login-subtitle">
                Por favor, complete sus datos para continuar
            </p>

            <form id="user-data-form" class="user-data-form">
                <div class="form-group">
                    <label for="user-name" class="form-label">
                        Nombre completo <span class="required">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="user-name" 
                        class="form-input" 
                        placeholder="Ej: Juan Pérez García"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="user-email" class="form-label">
                        Correo electrónico <span class="required">*</span>
                    </label>
                    <input 
                        type="email" 
                        id="user-email" 
                        class="form-input" 
                        placeholder="ejemplo@email.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="user-phone" class="form-label">
                        Teléfono <span class="required">*</span>
                    </label>
                    <input 
                        type="tel" 
                        id="user-phone" 
                        class="form-input" 
                        placeholder="+34 600 000 000"
                        required
                    >
                </div>

                <div id="form-error-message" class="message error-message"></div>
                <div id="form-success-message" class="message success-message"></div>

                <button type="submit" id="submit-data-btn" class="login-button">
                    <i class="fas fa-check"></i> Continuar
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { logUserAccess } from '/src/js/accessLogger.js';

        // Configuración de EmailJS - REEMPLAZAR CON TUS CREDENCIALES
        const EMAILJS_CONFIG = {
            publicKey: 'TU_PUBLIC_KEY',        // Tu Public Key de EmailJS
            serviceId: 'TU_SERVICE_ID',         // Tu Service ID
            templateId: 'TU_TEMPLATE_ID'        // Tu Template ID
        };

        // Inicializar EmailJS
        if (typeof emailjs !== 'undefined') {
            emailjs.init(EMAILJS_CONFIG.publicKey);
            console.log('✅ EmailJS inicializado');
        }

        class SecureLogin {
            constructor() {
                this.attempts = this.getStoredAttempts();
                this.maxAttempts = 3;
                this.lockoutDuration = 10 * 60 * 1000;
                this.userInfo = null;
                this.init();
            }

            init() {
                if (sessionStorage.getItem('authenticated') === 'true') {
                    window.location.href = '/index.html';
                    return;
                }

                if (this.isLocked()) {
                    this.showLockoutMessage();
                    return;
                }

                this.setupEventListeners();
                this.initPasswordToggle();
            }

            isLocked() {
                if (this.attempts.count < this.maxAttempts) return false;
                const lockoutEnd = this.attempts.lastAttempt + this.lockoutDuration;
                return Date.now() < lockoutEnd;
            }

            getLockoutTimeRemaining() {
                if (!this.isLocked()) return 0;
                const lockoutEnd = this.attempts.lastAttempt + this.lockoutDuration;
                return Math.ceil((lockoutEnd - Date.now()) / 1000);
            }

            async verifyPassword(password) {
                if (this.isLocked()) {
                    throw new Error('Demasiados intentos fallidos. Intente más tarde.');
                }

                try {
                    const response = await fetch('/.netlify/functions/auth', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: password })
                    });

                    const data = await response.json();

                    if (!response.ok || !data.success) {
                        this.recordFailedAttempt();
                        throw new Error(data.error || 'Contraseña incorrecta');
                    }

                    this.userInfo = data.user;
                    this.resetAttempts();
                    
                    return {
                        success: true,
                        name: data.user.name,
                        type: data.user.type,
                        company: data.user.company
                    };

                } catch (error) {
                    if (error.message.includes('fetch')) {
                        throw new Error('Error de conexión. Verifique su conexión a internet.');
                    }
                    throw error;
                }
            }

            recordFailedAttempt() {
                this.attempts.count++;
                this.attempts.lastAttempt = Date.now();
                localStorage.setItem('authAttempts', JSON.stringify(this.attempts));
            }

            resetAttempts() {
                this.attempts = { count: 0, lastAttempt: 0 };
                localStorage.setItem('authAttempts', JSON.stringify(this.attempts));
            }

            getStoredAttempts() {
                try {
                    const stored = localStorage.getItem('authAttempts');
                    return stored ? JSON.parse(stored) : { count: 0, lastAttempt: 0 };
                } catch {
                    return { count: 0, lastAttempt: 0 };
                }
            }

            setupEventListeners() {
                const passwordInput = document.getElementById('password');
                const loginButton = document.getElementById('login-btn');
                const userDataForm = document.getElementById('user-data-form');

                loginButton.addEventListener('click', () => this.handleLogin());
                
                passwordInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.handleLogin();
                });

                passwordInput.addEventListener('input', () => this.hideAllMessages());

                userDataForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.handleUserDataSubmit();
                });
            }

            async handleLogin() {
                const passwordInput = document.getElementById('password');
                const loginButton = document.getElementById('login-btn');
                const password = passwordInput.value.trim();

                if (!password) {
                    this.showMessage('Por favor ingrese una contraseña', 'error');
                    passwordInput.focus();
                    return;
                }

                loginButton.disabled = true;
                loginButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando...';

                try {
                    const result = await this.verifyPassword(password);
                    
                    if (result.success) {
                        this.showMessage('¡Contraseña correcta!', 'success');
                        
                        // SI ES ADMIN, ir directo a la página sin pedir datos
                        if (result.type === 'admin' || result.type === 'standard') {
                            this.setAuthenticated(this.userInfo);
                            setTimeout(() => {
                                window.location.href = '/index.html';
                            }, 1000);
                        } else {
                            // Para inmobiliarias, mostrar formulario de datos
                            setTimeout(() => {
                                this.showUserDataForm();
                            }, 1000);
                        }
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    this.showMessage(error.message, 'error');
                    passwordInput.value = '';
                    passwordInput.focus();

                    if (this.isLocked()) {
                        setTimeout(() => this.showLockoutMessage(), 2000);
                    }
                } finally {
                    loginButton.disabled = false;
                    loginButton.innerHTML = '<i class="fas fa-sign-in-alt"></i> Acceder';
                }
            }

            showUserDataForm() {
                document.getElementById('password-step').classList.add('hidden');
                document.getElementById('user-data-step').classList.remove('hidden');
                document.getElementById('user-name').focus();
            }

            async handleUserDataSubmit() {
                const submitButton = document.getElementById('submit-data-btn');
                const userName = document.getElementById('user-name').value.trim();
                const userEmail = document.getElementById('user-email').value.trim();
                const userPhone = document.getElementById('user-phone').value.trim();

                if (!userName || !userEmail || !userPhone) {
                    this.showFormMessage('Por favor complete todos los campos', 'error');
                    return;
                }

                if (!this.validateEmail(userEmail)) {
                    this.showFormMessage('Por favor ingrese un email válido', 'error');
                    return;
                }

                submitButton.disabled = true;
                submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Registrando...';

                try {
                    const userData = {
                        name: userName,
                        email: userEmail,
                        phone: userPhone
                    };

                    // Guardar en Firebase y enviar email
                    await logUserAccess(userData, this.userInfo);

                    // Establecer autenticación
                    this.setAuthenticated({
                        ...this.userInfo,
                        userName: userName,
                        userEmail: userEmail,
                        userPhone: userPhone
                    });

                    this.showFormMessage('¡Registro exitoso! Redirigiendo...', 'success');

                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 1500);

                } catch (error) {
                    console.error('Error al registrar datos:', error);
                    this.showFormMessage('Error al registrar. Por favor intente nuevamente.', 'error');
                } finally {
                    submitButton.disabled = false;
                    submitButton.innerHTML = '<i class="fas fa-check"></i> Continuar';
                }
            }

            validateEmail(email) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            }

            setAuthenticated(userInfo) {
                sessionStorage.setItem('authenticated', 'true');
                sessionStorage.setItem('userInfo', JSON.stringify({
                    ...userInfo,
                    loginTime: new Date().toISOString()
                }));
            }

            showMessage(message, type) {
                this.hideAllMessages();
                const messageId = type === 'error' ? 'error-message' : 'success-message';
                const messageElement = document.getElementById(messageId);
                
                if (messageElement) {
                    messageElement.textContent = message;
                    messageElement.style.display = 'block';
                }
            }

            showFormMessage(message, type) {
                const messageId = type === 'error' ? 'form-error-message' : 'form-success-message';
                const messageElement = document.getElementById(messageId);
                
                document.getElementById('form-error-message').style.display = 'none';
                document.getElementById('form-success-message').style.display = 'none';
                
                if (messageElement) {
                    messageElement.textContent = message;
                    messageElement.style.display = 'block';
                }
            }

            hideAllMessages() {
                const messages = document.querySelectorAll('.message');
                messages.forEach(msg => msg.style.display = 'none');
            }

            showLockoutMessage() {
                const passwordInput = document.getElementById('password');
                const loginButton = document.getElementById('login-btn');
                
                if (passwordInput) passwordInput.disabled = true;
                if (loginButton) loginButton.disabled = true;

                const updateCountdown = () => {
                    const timeRemaining = this.getLockoutTimeRemaining();
                    
                    if (timeRemaining <= 0) {
                        location.reload();
                        return;
                    }

                    const minutes = Math.floor(timeRemaining / 60);
                    const seconds = timeRemaining % 60;
                    const message = `Demasiados intentos fallidos. Intente de nuevo en ${minutes}:${seconds.toString().padStart(2, '0')}`;
                    
                    this.showMessage(message, 'error');
                };

                updateCountdown();
                setInterval(updateCountdown, 1000);
            }

            initPasswordToggle() {
                const passwordInput = document.getElementById('password');
                const toggleButton = document.getElementById('togglePassword');
                const eyeIcon = document.getElementById('eyeIcon');
                
                if (!passwordInput || !toggleButton) return;

                let isPasswordVisible = false;

                const togglePassword = () => {
                    isPasswordVisible = !isPasswordVisible;
                    passwordInput.type = isPasswordVisible ? 'text' : 'password';
                    eyeIcon.className = isPasswordVisible ? 'fas fa-eye-slash' : 'fas fa-eye';
                    toggleButton.setAttribute('title', isPasswordVisible ? 'Ocultar contraseña' : 'Mostrar contraseña');
                    passwordInput.focus();
                };

                toggleButton.addEventListener('click', (e) => {
                    e.preventDefault();
                    togglePassword();
                });
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            new SecureLogin();
        });
    </script>
</body>
</html>
